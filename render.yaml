# Render blueprint for the API. The site and the panel are static builds and live on their own
# host, so this file creates only the web service and the database behind it.
#
# Create the stack from this file in Render's dashboard (New > Blueprint, pointed at the repository
# that holds it), or copy the three commands and the variable names into a service made by hand.
# Values marked sync: false are not stored here: type them in the dashboard once, because they are
# either the doctor's real addresses or a secret.

databases:
  - name: kandel-db
    databaseName: kandel_cms
    user: kandel
    plan: free
    # A free Postgres on Render is deleted 30 days after it is made. When the site starts carrying
    # real patient requests, move this to a paid instance and take the opportunity to back it up.
    postgresMajorVersion: "16"

services:
  - type: web
    name: kandel-api
    runtime: python
    # Singapore is the region nearest to Kathmandu, so the round trip a patient waits on is shorter.
    region: singapore
    plan: free
    # Everything below this line is read from the API folder, which sits at the top of this
    # repository next to the site and the panel: manage.py, requirements.txt, config/settings.py
    # and the five apps.
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    # The free plan's dashboard has no release command field and no shell, so the schema and the
    # first panel account are brought up inside render.sh, which runs on every boot. Both steps are
    # idempotent: migrate does nothing to a current database, and ensure_first_account only writes
    # an account where there is none and never touches a password that is already set.
    # One worker on purpose. The wrong password count and the throttles are counted in memory: two
    # workers would each hold their own idea of how many wrong passwords this browser has tried.
    startCommand: bash render.sh
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kandel-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TIME_ZONE
        value: Asia/Kathmandu
      - key: DJANGO_ALLOWED_HOSTS
        # Both names the API is reached by: the site's, because Vercel forwards /api here, and the
        # service's own, for Render's health check and any direct call. The leading dot entry covers
        # Vercel's preview addresses, which forward /api the same way and would otherwise be refused
        # as an invalid host. Public content and the submission form are all they can reach; a
        # stranger's preview cannot sign in, because the session cookie never leaves the main site.
        value: "drkandel.vercel.app,little-nest-family-connect.onrender.com,.vercel.app"
      - key: ADMIN_LOGIN_EMAILS
        sync: false
      # The emailed code is the second step for a browser the panel has not seen. It needs a working
      # mail account, so while there is none this is false and the allowlisted address gets in on its
      # password alone. Set it back to true as soon as mail works: a browser that already signed in
      # stays remembered either way, so the switch cannot lock the doctor out of his own panel.
      - key: OTP_REQUIRED
        value: "false"
      # render.sh makes this account on a database that has none, and leaves it alone afterwards.
      # Type them once, then change the password on the panel's own account screen.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # The panel is mounted at /admin on the site, so this is the site's own address with scheme.
      # It also builds the reset link that goes out by mail, so leaving it at the development
      # default sends the doctor a link to his own laptop.
      - key: PANEL_ORIGIN
        value: "https://drkandel.vercel.app"
      - key: PANEL_PATH
        value: /admin
      # Same origin as the site only if that host forwards /api and /media here. If it does not, the
      # sign in cookies are third party and the browser will not store them.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://drkandel.vercel.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Lax, not None: vercel.json forwards /api and /media to this service, so the browser only
      # ever talks to drkandel.vercel.app and the cookie stays first party. None would be needed if
      # the panel called this address directly, and then Safari would drop it.
      - key: AUTH_COOKIE_SAMESITE
        value: Lax
      # Render terminates TLS and forwards what the visitor used. Without these two the app believes
      # every call is plain http on the container's internal name.
      - key: USE_X_FORWARDED_HOST
        value: "true"
      - key: SECURE_PROXY_SSL_HEADER
        value: HTTP_X_FORWARDED_PROTO,https
      # Render's proxy overwrites the client address, which is what the lockout and the duplicate
      # enquiry check are counted against.
      - key: USE_X_FORWARDED_FOR
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      # One time codes and reset links cannot be delivered without these. Left empty, the letters are
      # written to outbox/ inside the build, which is gone by the next deploy, so sign in from a new
      # device stops working.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # The free and starter instance file systems are wiped on every deploy, so a picture added from
      # the panel disappears unless it is pointed at a Disk attached to the service
      # (Dashboard > Resources > Add Disk, then set MEDIA_ROOT to a folder inside its mount path).
      - key: MEDIA_ROOT
        sync: false
      - key: UPLOAD_MAX_BYTES
        value: "6291456"
