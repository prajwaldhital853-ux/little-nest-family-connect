<!doctype html>
<html lang="en">
  <!-- Regenerate with:
       "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=public\og-image.png file:///<this folder>\scripts\og-card.html
       Keep this file out of public/: it is a build source, not a shipped page. -->
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Libre+Franklin:wght@400;500&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }
      body { display: flex; font-family: "Libre Franklin", sans-serif; color: #2b2926; -webkit-font-smoothing: antialiased; }

      .photo { width: 470px; height: 630px; flex: none; overflow: hidden; }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; display: block; }

      .copy { flex: 1; padding: 96px 72px 0 72px; display: flex; flex-direction: column; }
      .kicker { font-size: 19px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #c8102e; }
      h1 { font-family: Archivo, sans-serif; font-weight: 800; font-size: 62px; line-height: 1.04; letter-spacing: -0.025em; margin-top: 22px; }
      .role { font-family: Archivo, sans-serif; font-weight: 500; font-size: 27px; color: #55504b; margin-top: 18px; }
      .line { width: 76px; height: 3px; background: #2b2926; margin: 40px 0 0; }
      .lede { font-size: 22px; line-height: 1.5; color: #55504b; margin-top: 32px; max-width: 540px; }
      .url { margin-top: auto; padding-bottom: 60px; font-size: 20px; font-weight: 500; letter-spacing: 0.02em; color: #8a847d; }
    </style>
  </head>
  <body>
    <div class="photo"><img src="../src/assets/doctor/ramesh-kandel-portrait.png" alt="" /></div>
    <div class="copy">
      <p class="kicker">Geriatric Medicine</p>
      <h1>Dr. Ramesh<br />Kandel</h1>
      <p class="role">Geriatrician · Rapti Academy of Health Sciences</p>
      <div class="line"></div>
      <p class="lede">Clinical care, healthy ageing, teaching and research collaboration in Nepal.</p>
      <p class="url">drkandel.vercel.app</p>
    </div>
  </body>
</html>
